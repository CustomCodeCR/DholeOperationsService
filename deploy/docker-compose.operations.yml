# Operations overlay for the existing DholeSystem Compose deployment.
services:
  operations-api:
    image: dhole/operations-api:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      TZ: America/Costa_Rica
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${OPERATIONS_DB:-dhole_operations};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      Auth__Jwt__Issuer: ${JWT_ISSUER:-DholeAuthService}
      Auth__Jwt__Audience: ${JWT_AUDIENCE:-DholeEcosystem}
      Auth__Jwt__SecretKey: ${JWT_SECRET}
    expose: ["8080", "8081"]
    networks: [dhole-runtime]
  operations-workers:
    image: dhole/operations-workers:${DHOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${DHOLE_ENV_FILE}
    environment:
      TZ: America/Costa_Rica
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${OPERATIONS_DB:-dhole_operations};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
    networks: [dhole-runtime]
networks:
  dhole-runtime:
    external: true
    name: ${DHOLE_NETWORK:-dhole}
